#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/UnitTests.yml

  online-sql-tests:
    name: Online SQL Tests
    uses: ./.github/workflows/SQLTests.yml
    secrets: inherit

  duckdb-stable-build:
    name: Build extension binaries
    needs: unit-tests
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: feishu_bitable
      # This extension needs native TLS sockets, which the Wasm sandbox cannot
      # provide. Wasm targets are opt_in:false in extension-ci-tools'
      # distribution_matrix.json, i.e. built unless excluded here. Keep this list
      # in sync with excluded_platforms in docs/community/description.yml.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: feishu_bitable
      format_checks: 'format;tidy'
