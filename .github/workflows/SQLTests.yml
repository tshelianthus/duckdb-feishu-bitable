#
# Protected, real-API SQLLogicTests. Public callers may omit all secrets: in
# that case the credential-check job warns and the online job is skipped.
#
name: Online SQL Tests

on:
  workflow_call:
    secrets:
      FEISHU_TEST_APP_ID:
        required: false
      FEISHU_TEST_APP_SECRET:
        required: false
      FEISHU_TEST_APP_TOKEN:
        required: false
      FEISHU_TEST_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: sql-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Check online test credentials
    runs-on: ubuntu-latest
    # Resolve environment-scoped secrets here as well as in the test job.
    # Otherwise they would be incorrectly classified as unavailable.
    environment: integration-tests
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        name: Check optional secret set
        env:
          FEISHU_TEST_APP_ID: ${{ secrets.FEISHU_TEST_APP_ID }}
          FEISHU_TEST_APP_SECRET: ${{ secrets.FEISHU_TEST_APP_SECRET }}
          FEISHU_TEST_APP_TOKEN: ${{ secrets.FEISHU_TEST_APP_TOKEN }}
          FEISHU_TEST_URL: ${{ secrets.FEISHU_TEST_URL }}
        shell: bash
        run: |
          missing=0
          for name in FEISHU_TEST_APP_ID FEISHU_TEST_APP_SECRET FEISHU_TEST_APP_TOKEN FEISHU_TEST_URL; do
            if [ -z "${!name}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::warning::Feishu online SQL tests skipped: optional integration-test secrets are not configured."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  sql-tests:
    name: Run online SQLLogicTests
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    steps:
      # Free disk space BEFORE checkout matching WriteTests.yml to prevent "No space left on device"
      # errors during debug compilation (e.g. run 39677181928).
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        continue-on-error: true
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_folders: /opt/az /opt/ghc /opt/google /opt/hostedtoolcache /opt/microsoft /usr/lib/firefox /usr/lib/jvm /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /usr/local/share/boost /usr/local/share/chromium /usr/local/share/powershell /usr/share/dotnet /usr/share/swift /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Build debug extension
        env:
          GEN: ninja
          BUILD_WORKERS: "2"
          EXT_DEBUG_FLAGS: -DDUCKDB_DEBUG_LINK_JOBS=1
        run: make debug

      - name: Run protected integration tests
        # Re-export build env vars so make test_sql_online_debug does not fail if it re-enters the debug recipe
        env:
          GEN: ninja
          BUILD_WORKERS: "2"
          EXT_DEBUG_FLAGS: -DDUCKDB_DEBUG_LINK_JOBS=1
          FEISHU_TEST_APP_ID: ${{ secrets.FEISHU_TEST_APP_ID }}
          FEISHU_TEST_APP_SECRET: ${{ secrets.FEISHU_TEST_APP_SECRET }}
          FEISHU_TEST_APP_TOKEN: ${{ secrets.FEISHU_TEST_APP_TOKEN }}
          FEISHU_TEST_URL: ${{ secrets.FEISHU_TEST_URL }}
        run: make test_sql_online_debug
